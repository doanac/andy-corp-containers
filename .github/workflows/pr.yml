name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        docker_dir: [shellhttpd]

    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Set short git commit SHA
        id: tag
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "short_sha=$calculatedSha" >> $GITHUB_OUTPUT
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push docker image
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          context: "{{ defaultContext }}:${{ matrix.docker_dir }}"
          tags: |
            ghcr.io/doanac/andy-corp-${{ matrix.docker_dir }}:${{ steps.tag.outputs.short_sha }}
            ghcr.io/doanac/andy-corp-${{ matrix.docker_dir }}:${{ github.ref_name }}
      -
        name: Save image URI
        id: pinning
        run: |
          uri=ghcr.io/doanac/andy-corp-${{ matrix.docker_dir }}@${{ steps.docker_build.outputs.digest }}
          echo "image_uri_${{matrix.docker_dir}}=$uri" >> $GITHUB_OUTPUT

