name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        docker_dir: [shellhttpd]

    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}
      image_uri_shellhttpd: ${{ steps.pinning.outputs.image_uri_shellhttpd }}

    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Set short git commit SHA
        id: tag
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "short_sha=$calculatedSha" >> $GITHUB_OUTPUT
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push docker image
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          context: "{{ defaultContext }}:${{ matrix.docker_dir }}"
          tags: |
            ghcr.io/doanac/andy-corp-${{ matrix.docker_dir }}:${{ steps.tag.outputs.short_sha }}
            ghcr.io/doanac/andy-corp-${{ matrix.docker_dir }}:${{ github.ref_name }}
      -
        name: Save image URI
        id: pinning
        run: |
          uri=ghcr.io/doanac/andy-corp-${{ matrix.docker_dir }}@${{ steps.docker_build.outputs.digest }}
          echo "image_uri_${{matrix.docker_dir}}=$uri" >> $GITHUB_OUTPUT

  build-app:
    needs: build-images
    runs-on: ubuntu-latest
    container:
      image: foundries/lmp-app-tools
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push shellhttpd
        id: app
        working-directory: shellhttpd
        run: |
          composectl publish -d app.hash --pinned-images ${{needs.build-images.outputs.image_uri_shellhttpd}} ghcr.io/doanac/andy-corp-shellhttpd-app:${{ needs.build-images.outputs.image_tag }} amd64,arm64
          uri="ghcr.io/doanac/andy-corp-shellhttpd-app@$(cat app.hash)"
          echo "app_uri=$uri" >> $GITHUB_OUTPUT

          mkdir /tmp/apps
          composectl pull -i /tmp/apps -s /tmp/apps ${uri}
      -
        name: Save content for offline use
        uses: actions/upload-artifact@v4
        with:
          name: offline-apps
          path: /tmp/apps
          if-no-files: error
