# Shared workflow for CI logic
name: ci-shared

on:
  workflow_call:
    inputs:
      imgtag:
        required: true
        type: string
      push:
        required: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        docker_dir: [shellhttpd, dg-satellite]

    outputs:
      image_tag: ${{ steps.tag.outputs.short_sha }}
      image_uri_shellhttpd: ${{ steps.pinning.outputs.image_uri_shellhttpd }}
      image_uri_dgsat: ${{ steps.pinning.outputs.image_uri_dg-satellite}}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set short git commit SHA
        id: tag
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "short_sha=$calculatedSha" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push docker image
        id: docker_build
        uses: docker/build-push-action@v3
        with:
          push: ${{ inputs.push }}
          platforms: linux/amd64,linux/arm64
          context: "{{ defaultContext }}:${{ matrix.docker_dir }}"
          tags: |
            ghcr.io/doanac/andy-corp-${{ matrix.docker_dir }}:${{ steps.tag.outputs.short_sha }}
            ghcr.io/doanac/andy-corp-${{ matrix.docker_dir }}:${{ inputs.imgtag }}
      - name: Save image URI
        id: pinning
        run: |
          uri=ghcr.io/doanac/andy-corp-${{ matrix.docker_dir }}@${{ steps.docker_build.outputs.digest }}
          echo "image_uri_${{matrix.docker_dir}}=$uri" >> $GITHUB_OUTPUT

  build-app:
    needs: build-images
    runs-on: ubuntu-latest
    container:
      image: foundries/lmp-app-tools
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate build number
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{secrets.github_token}}
      - name: Create offline update directory
        run: |
          mkdir /tmp/update
          mkdir /tmp/update/apps
          mkdir /tmp/update/tuf
      - name: Build and push shellhttpd
        id: shellhttpd
        working-directory: shellhttpd
        run: |
          set -x
          composectl publish -d app.hash --pinned-images ${{needs.build-images.outputs.image_uri_shellhttpd}} ghcr.io/doanac/andy-corp-shellhttpd-app:${{ needs.build-images.outputs.image_tag }} amd64,arm64
          uri="ghcr.io/doanac/andy-corp-shellhttpd-app@$(cat app.hash)"
          echo "uri=$uri" >> $GITHUB_OUTPUT
          composectl pull -i /tmp/update/apps -s /tmp/update/apps ${uri}
      - name: Build and push dg-satellite
        id: dgsat
        working-directory: dg-satellite
        run: |
          set -x
          composectl publish -d app.hash --pinned-images ${{needs.build-images.outputs.image_uri_dgsat}} ghcr.io/doanac/andy-corp-dg-satellite-app:${{ needs.build-images.outputs.image_tag }} amd64,arm64
          uri="ghcr.io/doanac/andy-corp-dg-satellite-app@$(cat app.hash)"
          echo "uri=$uri" >> $GITHUB_OUTPUT
          composectl pull -i /tmp/update/apps -s /tmp/update/apps ${uri}
      - name: Create TUF target
        run: |
          set -x
          now=$(date +'%Y-%m-%dT:%H:%M:%SZ')
          expires=$(date -d@"$(( `date +%s`+31536000))" +'%Y-%m-%dT:%H:%M:%SZ') # 1 year from now
          build_num=${{ steps.buildnumber.outputs.build_number}}
          cat >/tmp/update/tuf/targets.json <<EOF
          {
            "signed" : {
              "_type" : "Targets",
              "expires" : "${expires}",
              "targets" : {
                "amd64-linux-${build_num}" : {
                  "custom" : {
                    "createdAt" : "${now}",
                    "docker_compose_apps": {
                      "shellhttpd": {
                        "uri": "${{ steps.shellhttpd.outputs.uri }}"
                      },
                      "dg-satellite": {
                        "uri": "${{ steps.dgsat.outputs.uri }}"
                      }
                    },
                    "hardwareIds" : [
                      "intel-corei7-64"
                    ],
                    "name" : "amd64-linux",
                    "tags" : [
                      "${{ github.ref_name }}"
                    ],
                    "targetFormat" : "OSTREE",
                    "version" : "${build_num}"
                  },
                  "hashes" : {
                    "sha256" : "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
                  },
                  "length" : 0
                }
              }
            }
          }
          EOF
      - name: Save content for offline use
        uses: actions/upload-artifact@v4
        with:
          name: offline-apps
          path: /tmp/update
          if-no-files-found: error
